# .github/workflows/security.yml — Phase B : contrôles sécurité sur le code et les dépendances
# Politique retenue : on bloque les secrets ET les vulnérabilités HIGH + CRITICAL
# qui ont un correctif disponible. L'existant est inventorié dans .trivyignore (avec date de fin).

name: Security

on:
  pull_request:
    branches: [main, staging, prod]
  schedule:
    - cron: "17 5 * * 1"         # chaque lundi : détecte les NOUVELLES CVE sur du code inchangé
  workflow_call: {}             # appelé par deploy.yml sur push vers staging / main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # github.workflow = nom de l'appelant quand le workflow est appelé par deploy.yml
  group: ${{ github.workflow }}-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------ SECRETS DANS LE GIT
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0            # tout l'historique : un secret supprimé reste dans les anciens commits

      - name: Scan gitleaks
        run: |
          # Baseline = secrets historiques déjà connus (à révoquer !) pour ne bloquer que les nouveaux
          BASELINE=""
          if [ -f .gitleaks-baseline.json ]; then
            BASELINE="--baseline-path=/repo/.gitleaks-baseline.json"
          fi
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 \
            detect --source=/repo --redact --verbose $BASELINE
          # --redact : les valeurs trouvées ne s'affichent jamais dans les logs

  # -------------------------------------------- DÉPENDANCES VULNÉRABLES (SCA)
  dependencies:
    name: Dépendances (Trivy fs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Rapport complet (non bloquant) — la "dette sécu connue"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: LOW,MEDIUM,HIGH,CRITICAL
          format: table
          output: trivy-report.txt
          exit-code: "0"

      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-deps-report
          path: trivy-report.txt
          retention-days: 30

      - name: Gate — HIGH/CRITICAL corrigeables (bloquant)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true       # ne bloque pas sur ce qui n'a pas encore de correctif
          trivyignores: .trivyignore # exceptions datées (voir modèle)
          format: table
          exit-code: "1"
