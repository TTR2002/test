# .github/dependabot.yml — PR automatiques de mise à jour de dépendances
# Projet test : les PR Dependabot visent la branche par défaut (main).

version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      patchs-front:
        update-types: [patch, minor]   # regroupe les petites MAJ en une seule PR
    ignore:
      # Versions majeures = changements cassants : elles se planifient à la main, pas en PR auto
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: maven
    directory: /server
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    ignore:
      # Java 8 / Boot 2.7 : on refuse les sauts de version majeure (migration = autre chantier)
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]

  # Docker : on garde Java 8 et Node 20 ; seules les mises à jour de correctif de l'image passent
  - package-ecosystem: docker
    directory: /server
    schedule: { interval: weekly }
    ignore:
      # Versions majeures = changements cassants : elles se planifient à la main, pas en PR auto
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /app
    schedule: { interval: weekly }
    ignore:
      # Versions majeures = changements cassants : elles se planifient à la main, pas en PR auto
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions   # garde les actions de la CI à jour (supply chain)
    directory: /
    schedule: { interval: weekly }
